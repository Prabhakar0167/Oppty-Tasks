<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3 SVG Animation Examples</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
            gap: 30px;
            min-height: 100vh;
        }

        h1 {
            color: #e94560;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 10px;
        }

        .containers-wrapper {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .container {
            background: #16213e;
            border-radius: 20px;
            padding: 20px;
            width: 350px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid #0f3460;
            text-align: center;
        }

        .container h2 {
            color: #e94560;
            margin-bottom: 10px;
            font-size: 1.2rem;
        }

        .container p {
            color: #a0a0b0;
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        svg {
            background: #0a0a1a;
            border-radius: 12px;
            border: 1px solid #0f3460;
        }

        .btn-group {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 8px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }

        .btn-start {
            background: #e94560;
            color: white;
        }

        .btn-stop {
            background: #533483;
            color: white;
        }

        .btn-reset {
            background: #0f3460;
            color: white;
        }
    </style>
</head>
<body>

    <h1>🎨 3 SVG Animation Examples</h1>

    <div class="containers-wrapper">

        <!-- ===================== -->
        <!-- CONTAINER 1: BOUNCING BALL -->
        <!-- ===================== -->
        <div class="container">
            <h2>🏀 Bouncing Ball</h2>
            <p>A ball bouncing with gravity effect</p>
            <svg id="svg1" width="310" height="250" viewBox="0 0 310 250">
                <!-- Floor line -->
                <line x1="10" y1="230" x2="300" y2="230" stroke="#0f3460" stroke-width="2"/>
                <!-- Shadow -->
                <ellipse id="ball-shadow" cx="155" cy="232" rx="25" ry="5" fill="rgba(233,69,96,0.2)"/>
                <!-- Ball -->
                <circle id="ball" cx="155" cy="40" r="20" fill="#e94560"/>
                <!-- Ball shine -->
                <circle id="ball-shine" cx="148" cy="33" r="6" fill="rgba(255,255,255,0.3)"/>
            </svg>
            <div class="btn-group">
                <button class="btn-start" onclick="startBounce()">Start</button>
                <button class="btn-stop" onclick="stopBounce()">Stop</button>
                <button class="btn-reset" onclick="resetBounce()">Reset</button>
            </div>
        </div>

        <!-- ===================== -->
        <!-- CONTAINER 2: SPINNING LOADER -->
        <!-- ===================== -->
        <div class="container">
            <h2>⚙️ Spinning Gear Loader</h2>
            <p>Rotating gear with pulsing center</p>
            <svg id="svg2" width="310" height="250" viewBox="0 0 310 250">
                <!-- Outer ring dots -->
                <g id="outer-dots"></g>
                <!-- Gear shape -->
                <g id="gear-group" transform="translate(155,125)">
                    <!-- Gear teeth -->
                    <polygon id="gear" points="" fill="none" stroke="#533483" stroke-width="2"/>
                    <!-- Outer circle -->
                    <circle cx="0" cy="0" r="45" fill="none" stroke="#533483" stroke-width="2" stroke-dasharray="5,5"/>
                    <!-- Inner circle -->
                    <circle id="pulse-circle" cx="0" cy="0" r="20" fill="#e94560" opacity="0.8"/>
                    <!-- Center dot -->
                    <circle cx="0" cy="0" r="5" fill="#1a1a2e"/>
                </g>
                <!-- Status text -->
                <text id="loader-text" x="155" y="220" text-anchor="middle" fill="#a0a0b0" font-size="12">Ready</text>
            </svg>
            <div class="btn-group">
                <button class="btn-start" onclick="startLoader()">Start</button>
                <button class="btn-stop" onclick="stopLoader()">Stop</button>
                <button class="btn-reset" onclick="resetLoader()">Reset</button>
            </div>
        </div>

        <!-- ===================== -->
        <!-- CONTAINER 3: WAVE ANIMATION -->
        <!-- ===================== -->
        <div class="container">
            <h2>🌊 Ocean Wave</h2>
            <p>Smooth flowing wave with floating boat</p>
            <svg id="svg3" width="310" height="250" viewBox="0 0 310 250">
                <!-- Sky gradient -->
                <defs>
                    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                        <stop offset="0%" style="stop-color:#0f3460;stop-opacity:0.6"/>
                        <stop offset="100%" style="stop-color:#0a0a1a;stop-opacity:0.9"/>
                    </linearGradient>
                </defs>
                <!-- Stars -->
                <circle cx="30" cy="30" r="1.5" fill="#fff" opacity="0.6"/>
                <circle cx="80" cy="50" r="1" fill="#fff" opacity="0.4"/>
                <circle cx="200" cy="25" r="1.5" fill="#fff" opacity="0.7"/>
                <circle cx="260" cy="60" r="1" fill="#fff" opacity="0.5"/>
                <circle cx="140" cy="15" r="1" fill="#fff" opacity="0.3"/>
                <!-- Moon -->
                <circle cx="270" cy="35" r="15" fill="#f0e68c" opacity="0.8"/>
                <circle cx="278" cy="30" r="13" fill="#0a0a1a"/>
                <!-- Wave paths -->
                <path id="wave1" d="" fill="url(#waterGrad)" opacity="0.6"/>
                <path id="wave2" d="" fill="#0f3460" opacity="0.4"/>
                <path id="wave3" d="" fill="#e94560" opacity="0.15"/>
                <!-- Boat -->
                <g id="boat">
                    <polygon points="-15,0 15,0 10,-5 -10,-5" fill="#8B4513"/>
                    <line x1="0" y1="-5" x2="0" y2="-25" stroke="#8B4513" stroke-width="2"/>
                    <polygon points="0,-25 0,-10 12,-15" fill="#f0e68c" opacity="0.8"/>
                </g>
            </svg>
            <div class="btn-group">
                <button class="btn-start" onclick="startWave()">Start</button>
                <button class="btn-stop" onclick="stopWave()">Stop</button>
                <button class="btn-reset" onclick="resetWave()">Reset</button>
            </div>
        </div>

    </div>

    <script>
        // ================================
        // ANIMATION 1: BOUNCING BALL
        // ================================
        let bounceAnim = null;
        let ballY = 40;
        let ballVelocity = 0;
        const gravity = 0.5;
        const bounce = -0.75;
        const floorY = 210;

        function animateBounce() {
            const ball = document.getElementById('ball');
            const shine = document.getElementById('ball-shine');
            const shadow = document.getElementById('ball-shadow');

            // Apply gravity
            ballVelocity += gravity;
            ballY += ballVelocity;

            // Bounce off floor
            if (ballY >= floorY) {
                ballY = floorY;
                ballVelocity *= bounce;

                // Small threshold to stop micro-bounces
                if (Math.abs(ballVelocity) < 1) {
                    ballVelocity = -12; // restart bounce
                }
            }

            // Update ball position
            ball.setAttribute('cy', ballY);
            shine.setAttribute('cy', ballY - 7);

            // Shadow scales with distance from floor
            const distFromFloor = floorY - ballY;
            const shadowScale = Math.max(0.3, 1 - distFromFloor / 200);
            shadow.setAttribute('rx', 25 * shadowScale);
            shadow.setAttribute('opacity', shadowScale * 0.4);

            // Squash & stretch
            const speed = Math.abs(ballVelocity);
            const stretchY = Math.min(1.3, 1 + speed / 40);
            const squashX = 1 / Math.sqrt(stretchY);

            ball.setAttribute('transform',
                `translate(155, ${ballY}) scale(${squashX}, ${stretchY}) translate(-155, ${-ballY})`);

            bounceAnim = requestAnimationFrame(animateBounce);
        }

        function startBounce() {
            if (!bounceAnim) {
                bounceAnim = requestAnimationFrame(animateBounce);
            }
        }

        function stopBounce() {
            if (bounceAnim) {
                cancelAnimationFrame(bounceAnim);
                bounceAnim = null;
            }
        }

        function resetBounce() {
            stopBounce();
            ballY = 40;
            ballVelocity = 0;
            const ball = document.getElementById('ball');
            const shine = document.getElementById('ball-shine');
            const shadow = document.getElementById('ball-shadow');
            ball.setAttribute('cy', 40);
            ball.setAttribute('transform', '');
            shine.setAttribute('cy', 33);
            shadow.setAttribute('rx', 25);
            shadow.setAttribute('opacity', 0.2);
        }


        // ================================
        // ANIMATION 2: SPINNING GEAR LOADER
        // ================================
        let loaderAnim = null;
        let gearAngle = 0;
        let pulseSize = 20;
        let pulseGrowing = true;
        let loadPercent = 0;

        // Create outer dots
        (function createOuterDots() {
            const container = document.getElementById('outer-dots');
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30) * Math.PI / 180;
                const x = 155 + Math.cos(angle) * 90;
                const y = 125 + Math.sin(angle) * 90;
                const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                dot.setAttribute('cx', x);
                dot.setAttribute('cy', y);
                dot.setAttribute('r', 3);
                dot.setAttribute('fill', '#533483');
                dot.setAttribute('opacity', '0.3');
                dot.setAttribute('class', 'outer-dot');
                dot.id = `dot-${i}`;
                container.appendChild(dot);
            }
        })();

        // Create gear teeth
        (function createGear() {
            const teeth = 8;
            const innerR = 35;
            const outerR = 50;
            let points = '';
            for (let i = 0; i < teeth; i++) {
                const a1 = (i * 360 / teeth) * Math.PI / 180;
                const a2 = ((i + 0.3) * 360 / teeth) * Math.PI / 180;
                const a3 = ((i + 0.5) * 360 / teeth) * Math.PI / 180;
                const a4 = ((i + 0.7) * 360 / teeth) * Math.PI / 180; // Corrected: was 0.5
                points += `${Math.cos(a1)*innerR},${Math.sin(a1)*innerR} `;
                points += `${Math.cos(a2)*outerR},${Math.sin(a2)*outerR} `;
                points += `${Math.cos(a3)*outerR},${Math.sin(a3)*outerR} `;
                points += `${Math.cos(a4)*innerR},${Math.sin(a4)*innerR} `;
            }
            document.getElementById('gear').setAttribute('points', points.trim());
        })();

        function animateLoader() {
            gearAngle += 2;

            // Rotate gear
            const gearGroup = document.getElementById('gear-group');
            gearGroup.setAttribute('transform', `translate(155,125) rotate(${gearAngle})`);

            // Pulse center circle
            const pulseCircle = document.getElementById('pulse-circle');
            if (pulseGrowing) {
                pulseSize += 0.3;
                if (pulseSize >= 28) pulseGrowing = false;
            } else {
                pulseSize -= 0.3;
                if (pulseSize <= 15) pulseGrowing = true;
            }
            pulseCircle.setAttribute('r', pulseSize);
            pulseCircle.setAttribute('opacity', 0.4 + (pulseSize - 15) / 30);

            // Animate outer dots
            for (let i = 0; i < 12; i++) {
                const dot = document.getElementById(`dot-${i}`);
                const phase = (gearAngle + i * 30) % 360;
                const opacity = 0.2 + 0.8 * Math.abs(Math.sin(phase * Math.PI / 180));
                const r = 2 + 2 * Math.abs(Math.sin(phase * Math.PI / 180));
                dot.setAttribute('opacity', opacity);
                dot.setAttribute('r', r);
                dot.setAttribute('fill', opacity > 0.6 ? '#e94560' : '#533483');
            }

            // Update loading text
            loadPercent = (loadPercent + 0.5) % 101;
            document.getElementById('loader-text').textContent =
                `Loading... ${Math.floor(loadPercent)}%`;

            loaderAnim = requestAnimationFrame(animateLoader);
        }

        function startLoader() {
            if (!loaderAnim) {
                loaderAnim = requestAnimationFrame(animateLoader);
            }
        }

        function stopLoader() {
            if (loaderAnim) {
                cancelAnimationFrame(loaderAnim);
                loaderAnim = null;
            }
        }

        function resetLoader() {
            stopLoader();
            gearAngle = 0;
            pulseSize = 20;
            loadPercent = 0;
            document.getElementById('gear-group').setAttribute('transform', 'translate(155,125) rotate(0)');
            document.getElementById('pulse-circle').setAttribute('r', 20);
            document.getElementById('loader-text').textContent = 'Ready';
            for (let i = 0; i < 12; i++) {
                const dot = document.getElementById(`dot-${i}`);
                dot.setAttribute('opacity', 0.3);
                dot.setAttribute('r', 3);
                dot.setAttribute('fill', '#533483');
            }
        }


        // ================================
        // ANIMATION 3: OCEAN WAVE
        // ================================
        let waveAnim = null;
        let waveOffset = 0;

        function generateWavePath(offset, amplitude, frequency, baseY) {
            let path = `M 0 250 L 0 ${baseY}`;
            for (let x = 0; x <= 310; x += 5) {
                const y = baseY + Math.sin((x + offset) * frequency * Math.PI / 180) * amplitude
                              + Math.sin((x + offset * 0.7) * frequency * 1.5 * Math.PI / 180) * (amplitude * 0.4);
                path += ` L ${x} ${y}`;
            }
            path += ' L 310 250 Z';
            return path;
        }

        function animateWave() {
            waveOffset += 2;

            // Three wave layers at different speeds
            document.getElementById('wave1').setAttribute('d',
                generateWavePath(waveOffset, 15, 1.2, 150));
            document.getElementById('wave2').setAttribute('d',
                generateWavePath(waveOffset * 1.3, 12, 1.5, 165));
            document.getElementById('wave3').setAttribute('d',
                generateWavePath(waveOffset * 0.8, 10, 1.8, 155));

            // Move boat on wave1
            const boat = document.getElementById('boat');
            const boatX = 80 + Math.sin(waveOffset * 0.01) * 50;
            const boatY = 150 + Math.sin((boatX + waveOffset) * 1.2 * Math.PI / 180) * 15
                              + Math.sin((boatX + waveOffset * 0.7) * 1.8 * Math.PI / 180) * 6;
            const boatTilt = Math.cos((boatX + waveOffset) * 1.2 * Math.PI / 180) * 10;

            boat.setAttribute('transform',
                `translate(${boatX}, ${boatY - 5}) rotate(${boatTilt})`);

            waveAnim = requestAnimationFrame(animateWave);
        }

        // Initialize wave paths
        document.getElementById('wave1').setAttribute('d', generateWavePath(0, 15, 1.2, 150));
        document.getElementById('wave2').setAttribute('d', generateWavePath(0, 12, 1.5, 165));
        document.getElementById('wave3').setAttribute('d', generateWavePath(0, 10, 1.8, 155));
        document.getElementById('boat').setAttribute('transform', 'translate(80, 145)');

        function startWave() {
            if (!waveAnim) {
                waveAnim = requestAnimationFrame(animateWave);
            }
        }

        function stopWave() {
            if (waveAnim) {
                cancelAnimationFrame(waveAnim);
                waveAnim = null;
            }
        }

        function resetWave() {
            stopWave();
            waveOffset = 0;
            document.getElementById('wave1').setAttribute('d', generateWavePath(0, 15, 1.2, 150));
            document.getElementById('wave2').setAttribute('d', generateWavePath(0, 12, 1.5, 165));
            document.getElementById('wave3').setAttribute('d', generateWavePath(0, 10, 1.8, 155));
            document.getElementById('boat').setAttribute('transform', 'translate(80, 145)');
        }
    </script>

</body>
</html>
